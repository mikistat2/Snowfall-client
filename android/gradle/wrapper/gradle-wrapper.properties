distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Capacitor 7 ships 8.11.1; 8.14.3 is used instead because it is already in this
# machine's Gradle cache and 8.11.1 is not — downloading it timed out. Both
# satisfy AGP 8.7.2 (which needs Gradle 8.9+) and both are on the 8.x line, so
# there is no removed-API breakage. Revert this URL to gradle-8.11.1-all.zip if
# you would rather have the Capacitor default.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# 10s is not enough to fetch a ~130MB distribution on a slow link.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
